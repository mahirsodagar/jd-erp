<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Application Accepted</title>
</head>

<body style="margin:0; padding:0; background-color:#f5f7fa;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f5f7fa"
        style="font-family:Arial, Helvetica, sans-serif;">
        <tr>
            <td align="center">
                <table width="100%" cellpadding="0" cellspacing="0" border="0"
                    style="max-width:540px; background-color:#ffffff; border-radius:6px; margin:32px 0; box-shadow:0 1px 2px rgba(0,0,0,0.03);">
                    <!-- Header -->
                    <tr>
                        <td align="left"
                            style="padding:22px 28px 10px 28px; background-color:#204d74; border-radius:6px 6px 0 0; color:#ffffff; font-size:17px; font-weight:bold;">
                            JDSD / JDINST
                        </td>
                    </tr>
                    <!-- Content -->
                    <tr>
                        <td align="left" style="padding:22px 28px 12px 28px; color:#223248; font-size:15px;">
                            <p style="margin:0 0 10px 0;">Hi <span style="font-weight:bold;">{{Student_Name}}</span>,
                            </p>
                            <p style="margin:0 0 18px 0;">Your leave application has been accepted.</p>
                            <table cellpadding="0" cellspacing="0" width="100%" border="0"
                                style="background-color:#f1f4f8; border:1px solid #d0d7df; border-radius:4px; margin-bottom:16px;">
                                <tr>
                                    <td style="padding:12px 18px;">
                                        <div style="margin-bottom:7px;"><strong>Leave Start Date:</strong>
                                            {{Leave_Start_Date}}</div>
                                        <div style="margin-bottom:7px;"><strong>Leave End Date:</strong>
                                            {{Leave_End_Date}}</div>
                                        <div style="margin-bottom:7px;"><strong>Leave Count:</strong> {{Leave_Count}}
                                        </div>
                                        <div><strong>Reason:</strong> {{Reason}}</div>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin:0 0 14px 0;">Regards,<br>JDSD / JDINST</p>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td align="left"
                            style="padding:14px 28px 18px 28px; background-color:#f5f7fa; color:#8492a6; font-size:13px; border-radius:0 0 6px 6px;">
                            Note: This is an auto-generated email. Please do not reply to this email.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
